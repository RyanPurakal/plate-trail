[project]
name = "platetrail"
version = "0.1.0"
description = "Location-privacy check-up: public fixed sensors near an area or a route"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "numpy",
    "httpx",
    "requests",
    "networkx",
    "osmnx>=2.0",
    "shapely>=2.0",
    "pyproj",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platetrail*"]

[tool.setuptools.package-data]
platetrail = ["regions/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
