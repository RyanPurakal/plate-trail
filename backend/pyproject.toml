[project]
name = "platetrail"
version = "0.1.0"
description = "Privacy audit of what ALPR read histories reveal about a driver (synthetic drivers only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2.0",
    "geoalchemy2",
    "psycopg[binary]>=3.1",
    "numpy",
    "httpx",
    "networkx",
    "osmnx>=2.0",
    "celery>=5.4",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["platetrail*"]

[tool.setuptools.package-data]
platetrail = ["sql/*.sql", "etl/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: test requires a PostGIS database (DATABASE_URL)"]
