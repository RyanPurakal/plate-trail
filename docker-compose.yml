services:
  api:
    build: ./backend
    environment:
      PLATETRAIL_DATA_DIR: /data
      CORS_ORIGINS: http://localhost:3000
      # Bundled region id or a .json path under /data; empty = the NJ default.
      PLATETRAIL_REGION: ${PLATETRAIL_REGION:-}
    volumes:
      # Overpass and OSMnx caches persist on the host so reruns don't refetch.
      - ./data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
